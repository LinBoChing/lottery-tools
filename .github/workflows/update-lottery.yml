name: Update lottery results

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1,5,9,13,17,21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Fetch latest and update history
        run: python update_lottery.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-draws.json history-539.json history-dayday.json
          git diff --cached --quiet || git commit -m "Update lottery results and history"
          git push
